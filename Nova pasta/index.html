<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fale agora com Sophia Muller pelo Telegram.">
  <meta name="theme-color" content="#ef72b6">
  <title>Sophia Muller — Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ef72b6'/%3E%3Cpath d='M14 31.5 49.5 18c1.7-.6 3.2.8 2.7 2.8l-6 27c-.4 1.8-2.2 2.4-3.7 1.5L33 42l-4.6 4.5c-.6.6-1.6.2-1.6-.7v-8.2l18-13.3-22 10.6-8.2-2.5c-1.7-.5-1.8-2.2-.6-2.9Z' fill='white'/%3E%3C/svg%3E">

  <style>
    :root {
      --pink: #ef72b6;
      --pink-dark: #db5aa0;
      --card: #fff3f8;
      --ink: #202334;
      --muted: #727489;
      --accent: #ff3d68;
      --online: #18bd56;
      --online-soft: #82dda0;
      --telegram: #0798d2;
      --telegram-dark: #007cb6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--pink);
      background-image: radial-gradient(circle, rgba(110, 34, 82, 0.28) 1px, transparent 1.2px);
      background-position: 12px 11px;
      background-size: 24px 24px;
    }

    .profile-card {
      width: min(320px, 100%);
      padding: 40px 32px 32px;
      text-align: center;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 21px 34px rgba(143, 43, 101, 0.23);
      animation: card-in 650ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .avatar-ring {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 23px;
      padding: 5px;
      border: 4px solid var(--accent);
      border-radius: 50%;
      background: var(--card);
      box-shadow: 0 7px 20px rgba(255, 61, 104, 0.12);
    }

    .avatar {
      position: relative;
      width: 112px;
      height: 112px;
      overflow: hidden;
      border-radius: 50%;
      background: #ddd;
    }

    /* A foto foi recortada visualmente da imagem de referência fornecida. */
    .avatar img {
      position: absolute;
      width: 536px;
      max-width: none;
      height: 540px;
      left: -193px;
      top: -132px;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .name-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      font-size: 1.38rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .emoji {
      font-size: 1.18rem;
      line-height: 1;
    }

    .age-badge {
      display: inline-grid;
      width: 21px;
      height: 21px;
      place-items: center;
      color: var(--accent);
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1;
      border: 3px solid currentColor;
      border-radius: 50%;
      letter-spacing: -0.08em;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 7px;
      color: var(--online);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-soft);
      box-shadow: 0 0 0 0 rgba(24, 189, 86, 0.25);
      animation: pulse 2s ease-out infinite;
    }

    .response-time {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 18px 0 23px;
      color: var(--muted);
      font-size: 0.77rem;
      line-height: 1.45;
      white-space: nowrap;
    }

    .response-time svg {
      flex: 0 0 auto;
    }

    .telegram-button {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      gap: 17px;
      width: 100%;
      padding: 13px 20px;
      color: #fff;
      text-decoration: none;
      background: var(--telegram);
      border-radius: 16px;
      box-shadow: 0 11px 22px rgba(0, 123, 181, 0.28);
      transition: transform 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .telegram-button:hover {
      transform: translateY(-3px);
      background: var(--telegram-dark);
      box-shadow: 0 15px 28px rgba(0, 123, 181, 0.35);
    }

    .telegram-button:active {
      transform: translateY(0);
    }

    .telegram-button:focus-visible {
      outline: 4px solid rgba(255, 61, 104, 0.35);
      outline-offset: 4px;
    }

    .telegram-icon {
      display: grid;
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      place-items: center;
      color: var(--telegram);
      background: #fff;
      border-radius: 50%;
    }

    .telegram-icon svg {
      width: 14px;
      height: 14px;
      transform: translate(-1px, 1px);
    }

    .button-label {
      max-width: 176px;
      font-size: 0.96rem;
      font-weight: 800;
      line-height: 1.18;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 7px rgba(24, 189, 86, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(24, 189, 86, 0);
      }
    }

    @media (max-width: 380px) {
      body {
        padding-inline: 14px;
      }

      .profile-card {
        padding: 34px 22px 26px;
      }

      .name-line {
        font-size: 1.22rem;
      }

      .response-time {
        font-size: 0.71rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
